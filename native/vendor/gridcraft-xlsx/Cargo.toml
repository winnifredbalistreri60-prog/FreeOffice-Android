[package]
name = "gridcraft-xlsx"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GridCraft formats with FreeOffice Android bounded ZIP reads"
[features]
test-support = []
[dependencies]
gridcraft-core = { path = "../../../vendor/gridcraft/crates/core" }
gridcraft-formula = { path = "../../../vendor/gridcraft/crates/formula" }
gridcraft-model = { path = "../../../vendor/gridcraft/crates/model" }
thiserror = "2"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
aes = { version = "0.9", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
