[package]
name = "freeoffice-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "freeoffice"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wordcraft-doc = { path = "../vendor/wordcraft/crates/doc" }
wordcraft-docx = { path = "../vendor/wordcraft/crates/docx" }
gridcraft-core = { path = "../vendor/gridcraft/crates/core" }
gridcraft-model = { path = "../vendor/gridcraft/crates/model" }
gridcraft-xlsx = { path = "vendor/gridcraft-xlsx" }
pdfcraft-cos = { path = "../vendor/pdfcraft/crates/cos" }
pdfcraft-edit = { path = "../vendor/pdfcraft/crates/edit" }
